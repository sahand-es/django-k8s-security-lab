        <h1>Console<span>.</span></h1>
        <p class="tag">The internal developer platform — observability, diagnostics, and integrations for every team.</p>
        <div class="metrics">
            <div class="m"><div class="k">99.98%</div><div class="l">Platform uptime</div></div>
            <div class="m"><div class="k">128</div><div class="l">Organizations</div></div>
            <div class="m"><div class="k">2.4k</div><div class="l">Integrations</div></div>
        </div>
    </div>
    <div class="pane-form">
        <div class="card authcard">
            <div class="tabs">
                <button type="button" data-tab="login" class="active">Sign in</button>
                <button type="button" data-tab="register">Create account</button>
            </div>
            <form id="login-form" class="active" method="post" action="/auth/login">
                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="your.username" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="primary">Sign in</button>
            </form>
            <form id="register-form" method="post" action="/auth/register">
                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="choose a username" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="primary">Create account</button>
            </form>
            <p class="hint" id="msg" style="margin-top:0.75rem;"></p>
        </div>
    </div>
</div>
<script>
const tabs = document.querySelectorAll(".tabs button");
const forms = { login: document.getElementById("login-form"), register: document.getElementById("register-form") };
tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(b => b.classList.toggle("active", b === t));
    Object.entries(forms).forEach(([k, f]) => f.classList.toggle("active", k === t.dataset.tab));
}));
document.querySelectorAll("#login-form, #register-form").forEach(form => form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const res = await fetch(form.action, {
        method: "POST",
        body: new URLSearchParams(fd),
        headers: { "Content-Type": "application/x-www-form-urlencoded" }
    });
    const data = await res.json();
    if (data.token) {
        window.location.href = "/dashboard";
    } else {
        document.getElementById("msg").textContent = data.error || "Something went wrong";
    }
}));
</script>
