apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: saas-app
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "1.5"
    limits.memory: 1.5Gi
    pods: "10"
