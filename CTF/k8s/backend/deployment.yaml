apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: saas-app
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: ctf/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          volumeMounts:
            - name: db
              mountPath: /app/db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "200Mi"
        - name: worker
          image: ctf/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runworker"]
          envFrom:
            - configMapRef:
                name: backend-config
          volumeMounts:
            - name: db
              mountPath: /app/db
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: db
          emptyDir: {}
