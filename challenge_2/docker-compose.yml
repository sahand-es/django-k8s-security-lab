services:
  oncall:
    build: .
    image: oncall-shadow-challenge:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      TEAM_FLAGS: "${TEAM_FLAGS:-flag_rce,flag_ssrf}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-compose-secret}"
      DEBUG: "${DEBUG:-0}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      SQLITE_PATH: "/tmp/oncall.sqlite3"
