{% extends "demos/base.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>Previewing: <code>{{ name }}</code></p>
  <div class="warning">{{ body }}</div>
  <p class="muted">
    <a href="/part1/xss/preview/?name={{ name }}">Render as HTML (trusts content)</a> ·
    <a href="/part1/xss/preview/fixed/?name={{ name }}">Render escaped</a>
  </p>
{% endblock %}
